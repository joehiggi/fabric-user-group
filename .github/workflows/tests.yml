name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild generated files and fail if they drift from what's committed
        run: |
          make data build
          git diff --exit-code -- data src
      - name: Run tests
        run: make test
